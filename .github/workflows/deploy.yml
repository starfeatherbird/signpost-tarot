# GitHub Pages 자동 배포: main 에 push 하면 빌드해서 Pages 에 올립니다.
# Supabase 주소·anon 키는 .env.production 에서 읽습니다(공개용 값). AI 키는 서버 시크릿에만 있습니다.
# 처음 한 번은 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 켜 두어야 합니다 (토큰 권한상 워크플로가 직접 켤 수 없음).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # 저장소 이름이 곧 하위 경로입니다: https://<user>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
